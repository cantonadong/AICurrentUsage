<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title data-i18n="actionTitle">AI Usage Monitor</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <div class="tabs">
      <button class="tab-btn active" data-provider="claude">Claude</button>
      <button class="tab-btn" data-provider="codex">Codex</button>
    </div>

    <div id="usage-panel" class="panel">
      <div class="row header-row">
        <span id="usage-title" class="label" data-i18n="claudeUsageTitle">Claude Usage</span>
        <button id="refresh-btn" class="refresh-btn" data-i18n-title="refreshTitle" title="Refresh">↻</button>
      </div>

      <div class="cards-row">
        <div class="card">
          <div class="row card-title-row">
            <span class="label" data-i18n="sessionCardTitle">Current Session (every 5 hours)</span>
          </div>

          <div class="usage-bar-wrap">
            <div class="usage-bar"><div id="session-fill" class="usage-fill" style="width:0%"></div></div>
            <span id="session-percent" class="usage-percent">--%</span>
          </div>

          <div class="row">
            <span class="label" data-i18n="resetTimeLabel">Reset Time</span>
            <span id="session-reset-time" class="value">--:--</span>
          </div>
          <div class="row">
            <span class="label" data-i18n="remainingLabel">Remaining</span>
            <span id="session-remaining-time" class="value">--:--</span>
          </div>
        </div>

        <div id="all-models-card" class="card">
          <div class="row card-title-row">
            <span class="label" data-i18n="allModelsCardTitle">All Models (every 7 days)</span>
          </div>

          <div class="usage-bar-wrap">
            <div class="usage-bar"><div id="weekly-fill" class="usage-fill" style="width:0%"></div></div>
            <span id="weekly-percent" class="usage-percent">--%</span>
          </div>

          <div class="row">
            <span class="label" data-i18n="resetTimeLabel">Reset Time</span>
            <span id="weekly-reset-time" class="value">--:--</span>
          </div>
          <div class="row">
            <span class="label" data-i18n="remainingLabel">Remaining</span>
            <span id="weekly-remaining-time" class="value">--:--</span>
          </div>
        </div>
      </div>

      <div id="status-line" class="status"></div>

      <details id="debug-details" class="debug" hidden>
        <summary data-i18n="debugSummary">Debug info (useful if fetching fails)</summary>
        <pre id="debug-text"></pre>
      </details>

      <div class="footer">
        <span id="last-updated" data-i18n="notQueriedYet">Not queried yet</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
